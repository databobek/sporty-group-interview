[project]
name = "betting-qa"
version = "0.1.0"
description = "Test automation for the Single Bet Placement feature (take-home assignment)"
requires-python = ">=3.12,<4.0"
dependencies = ["pytest (>=9.2.0,<10.0.0)", "selenium (>=4.52.0,<5.0.0)", "requests (>=2.34.2,<3.0.0)", "allure-pytest (>=2.16.2,<3.0.0)", "python-dotenv (>=1.2.4,<2.0.0)"]

[tool.poetry]
packages = [{ include = "betting_qa", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--alluredir=allure-results --clean-alluredir --strict-markers"
markers = [
    "ui: end-to-end tests through the browser",
    "api: tests against the HTTP API directly",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PT", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[dependency-groups]
dev = [
    "ruff (>=0.17.4,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "types-requests (>=2.33.0.20261030,<3.0.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]
