name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # publish the Allure report to the gh-pages branch

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  ALLURE_VERSION: "2.46.2"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - run: poetry install
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run mypy

  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      HEADLESS: "true"
      CANDIDATE_ID: ${{ secrets.CANDIDATE_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: pipx install poetry
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: poetry
      - run: poetry install

      # Chrome is preinstalled on GitHub's Ubuntu runners; Selenium Manager fetches ChromeDriver.
      - name: Run tests
        id: tests
        continue-on-error: true # the report is still built and published when tests fail
        run: poetry run pytest

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn

      - name: Fetch report history from gh-pages
        if: always() && github.event_name != 'pull_request'
        run: |
          git fetch origin gh-pages --depth=1 || exit 0
          git worktree add gh-pages-history origin/gh-pages
          if [ -d gh-pages-history/history ]; then cp -r gh-pages-history/history allure-results/; fi

      - uses: actions/setup-java@v4
        if: always() && github.event_name != 'pull_request'
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate Allure report
        if: always() && github.event_name != 'pull_request'
        run: |
          curl -sSL -o allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz
          "./allure-${ALLURE_VERSION}/bin/allure" generate allure-results --clean -o allure-report

      - name: Publish report to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Fail the job when tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
